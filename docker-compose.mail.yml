services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: logistica_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — el backend envía aquí
      - "8025:8025"   # Web UI — abre http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
