  /tracking/{codigo}:
    get:
      tags: [Tracking]
      summary: Consultar el estado y el historial de eventos de un envío a partir de su código de seguimiento.
      description: |
        Endpoint público (sin autenticación), pensado para que cualquier
        persona con el código de seguimiento pueda consultar el estado del
        envío.
      security: []
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código de seguimiento del envío.
          schema:
            type: string
            pattern: '^TRK-\d{8}-[A-Z0-9]{8}$'
            example: TRK-20260611-AB12CD34
      responses:
        '200':
          description: Información de tracking del envío.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TrackingResponseDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '404':
          description: Envío no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ENVIO_NOT_FOUND
                message: Envío no encontrado
                statusCode: 404
        '422':
          $ref: '#/components/responses/ValidationError'
  /rutas:
    post:
      tags: [Rutas]
      summary: Crear una nueva ruta asignando envíos, vehículo y repartidor.
      description: |
        Requiere rol OPERADOR. Dentro de una transacción: los envíos pasan a
        estado `EN_RUTA`, el vehículo pasa a `EN_RUTA` y el repartidor queda
        con `disponible: false`. Envía notificación `RUTA_ASIGNADA` al
        repartidor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearRutaRequest'
      responses:
        '201':
          description: Ruta creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RutaResponseDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 201
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Algún envío, el vehículo o el repartidor no existen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                envioNotFound:
                  summary: Alguno de los envíos no existe
                  value: { error: ENVIO_NOT_FOUND, message: "Envíos no encontrados", statusCode: 404 }
                vehiculoNotFound:
                  summary: Vehículo no encontrado
                  value: { error: VEHICULO_NOT_FOUND, message: Vehículo no encontrado, statusCode: 404 }
                repartidorNotFound:
                  summary: Repartidor no encontrado
                  value: { error: REPARTIDOR_NOT_FOUND, message: Repartidor no encontrado, statusCode: 404 }
        '422':
          description: Estado inválido del envío/vehículo/repartidor, o error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                envioInvalidState:
                  summary: Envío no está en estado PENDIENTE
                  value: { error: ENVIO_INVALID_STATE, message: "El envío no está en estado PENDIENTE", statusCode: 422 }
                envioAlreadyAssigned:
                  summary: Envío ya asignado a otra ruta
                  value: { error: ENVIO_ALREADY_ASSIGNED, message: "El envío ya está asignado a otra ruta", statusCode: 422 }
                vehiculoNotAvailable:
                  summary: Vehículo no disponible
                  value: { error: VEHICULO_NOT_AVAILABLE, message: "El vehículo no está disponible", statusCode: 422 }
                repartidorNotAvailable:
                  summary: Repartidor no disponible
                  value: { error: REPARTIDOR_NOT_AVAILABLE, message: "El repartidor no está disponible", statusCode: 422 }
        '500':
          description: No se pudo generar un código de ruta único.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: CODIGO_GENERATION_FAILED
                message: No se pudo generar un código de ruta único
                statusCode: 500
    get:
      tags: [Rutas]
      summary: Listar rutas con paginación.
      description: |
        Requiere rol OPERADOR o REPARTIDOR. Un usuario con rol REPARTIDOR ve
        solo sus propias rutas.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: repartidorId
          in: query
          required: false
          description: Filtrar por repartidor (uso típico de OPERADOR).
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de rutas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RutaResponseDto'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Repartidor no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: REPARTIDOR_NOT_FOUND
                message: Repartidor no encontrado
                statusCode: 404

