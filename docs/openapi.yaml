  /envios/{id}/confirmar:
    post:
      tags: [Entregas]
      summary: Confirmar la entrega de un envío asignado al repartidor autenticado, adjuntando evidencia fotográfica y firma.
      description: |
        Requiere rol REPARTIDOR. El envío debe pertenecer a una ruta del
        repartidor autenticado y no estar en un estado terminal (`ENTREGADO`,
        `CANCELADO`, `FALLIDO`). Guarda los archivos en
        `uploads/entregas/<envioId>/` y expone rutas públicas
        `/uploads/entregas/<envioId>/<archivo>`. Crea un `EventoEnvio` y
        cambia el estado del envío a `ENTREGADO`. Envía notificación al
        cliente con tipo `ENTREGA_REALIZADA` (incluye email).
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del envío
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                foto:
                  type: string
                  format: binary
                  description: Evidencia fotográfica de la entrega (image/jpeg o image/png, máx. 5 MB).
                firma:
                  type: string
                  format: binary
                  description: Firma del receptor (image/jpeg o image/png, máx. 5 MB).
              required: [foto, firma]
      responses:
        '200':
          description: Entrega confirmada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConfirmarEntregaResponseDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El envío no está asignado a una ruta del repartidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: FORBIDDEN
                message: El envío no está asignado a una ruta del repartidor
                statusCode: 403
        '404':
          description: Repartidor o envío no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                repartidorNotFound:
                  summary: Repartidor no encontrado
                  value: { error: REPARTIDOR_NOT_FOUND, message: Repartidor no encontrado, statusCode: 404 }
                envioNotFound:
                  summary: Envío no encontrado
                  value: { error: ENVIO_NOT_FOUND, message: Envío no encontrado, statusCode: 404 }
        '409':
          description: No se puede modificar un envío en estado terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_STATE_TRANSITION
                message: "No se puede modificar un envío en estado <estado>"
                statusCode: 409
        '422':
          description: Falta algún archivo requerido o el tipo de archivo no es soportado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFile:
                  summary: Faltan foto y/o firma
                  value: { error: MISSING_FILE, message: "Se requieren los archivos foto y firma", statusCode: 422 }
                invalidFileType:
                  summary: Tipo de archivo no soportado
                  value: { error: INVALID_FILE_TYPE, message: "Tipo de archivo no soportado: solo se admiten image/jpeg e image/png", statusCode: 422 }
                fileTooLarge:
                  summary: Archivo demasiado grande
                  value: { error: FILE_TOO_LARGE, message: "El archivo excede el tamaño máximo permitido (5MB)", statusCode: 422 }

  /envios/{id}/fallo:
    post:
      tags: [Entregas]
      summary: Registrar un fallo en la entrega de un envío asignado al repartidor autenticado.
      description: |
        Requiere rol REPARTIDOR. El envío debe pertenecer a una ruta del
        repartidor autenticado y no estar en un estado terminal (`ENTREGADO`,
        `CANCELADO`, `FALLIDO`). Si se adjunta `foto`, se guarda en
        `uploads/entregas/<envioId>/`. Cambia el estado del envío a `FALLIDO`
        y crea una `Incidencia` de tipo `ENTREGA_FALLIDA`. Envía dos
        notificaciones al cliente: tipo `CAMBIO_ESTADO` y tipo
        `INCIDENCIA_REPORTADA` (con email).
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del envío
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nota:
                  type: string
                  minLength: 1
                  description: Motivo/observación del fallo de entrega.
                foto:
                  type: string
                  format: binary
                  description: Evidencia fotográfica opcional del fallo (image/jpeg o image/png, máx. 5 MB).
              required: [nota]
      responses:
        '200':
          description: Fallo de entrega registrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegistrarFalloResponseDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El envío no está asignado a una ruta del repartidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: FORBIDDEN
                message: El envío no está asignado a una ruta del repartidor
                statusCode: 403
        '404':
          description: Repartidor o envío no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                repartidorNotFound:
                  summary: Repartidor no encontrado
                  value: { error: REPARTIDOR_NOT_FOUND, message: Repartidor no encontrado, statusCode: 404 }
                envioNotFound:
                  summary: Envío no encontrado
                  value: { error: ENVIO_NOT_FOUND, message: Envío no encontrado, statusCode: 404 }
        '409':
          description: No se puede modificar un envío en estado terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_STATE_TRANSITION
                message: "No se puede modificar un envío en estado <estado>"
                statusCode: 409
        '422':
          description: Tipo de archivo no soportado o archivo demasiado grande.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidFileType:
                  summary: Tipo de archivo no soportado
                  value: { error: INVALID_FILE_TYPE, message: "Tipo de archivo no soportado: solo se admiten image/jpeg e image/png", statusCode: 422 }
                fileTooLarge:
                  summary: Archivo demasiado grande
                  value: { error: FILE_TOO_LARGE, message: "El archivo excede el tamaño máximo permitido (5MB)", statusCode: 422 }

