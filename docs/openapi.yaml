  /incidencias/{id}:
    patch:
      tags: [Incidencias]
      summary: Actualizar el estado de una incidencia.
      description: |
        Requiere rol OPERADOR. Si `estado=RESUELTA` y la incidencia es de tipo
        `ENTREGA_FALLIDA` y el envío asociado está en estado `FALLIDO`, se
        ejecuta una reactivación: el envío vuelve a `EN_RUTA` (transacción que
        registra un `EventoEnvio`) y se notifica al cliente (tipo
        `CAMBIO_ESTADO`). No se permite reabrir una incidencia ya `RESUELTA`,
        ni transicionar al mismo estado actual.
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la incidencia
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEstadoIncidenciaRequest'
      responses:
        '200':
          description: Incidencia actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IncidenciaDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Incidencia no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INCIDENCIA_NOT_FOUND
                message: Incidencia no encontrada
                statusCode: 404
        '409':
          description: Transición de estado inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sameState:
                  summary: La incidencia ya está en ese estado
                  value: { error: INVALID_STATE_TRANSITION, message: "La incidencia ya se encuentra en ese estado", statusCode: 409 }
                reopenResolved:
                  summary: No se puede reabrir una incidencia resuelta
                  value: { error: INVALID_STATE_TRANSITION, message: "No se puede reabrir una incidencia resuelta", statusCode: 409 }
        '422':
          $ref: '#/components/responses/ValidationError'

