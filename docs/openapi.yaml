  /reportes/envios/export:
    get:
      tags: [Reportes]
      summary: Exportar el reporte de envíos en un rango de fechas como archivo CSV descargable.
      description: |
        Requiere rol OPERADOR. `desde` se interpreta como `T00:00:00.000Z` y
        `hasta` como `T23:59:59.999Z` (rango inclusivo). Los campos se escapan
        con comillas dobles si contienen comas, comillas o saltos de línea.
        Esta ruta está registrada antes que las rutas tipo `/envios/:id` para
        que Express no interprete `export` como un parámetro `:id`.
      parameters:
        - name: desde
          in: query
          required: true
          description: Fecha de inicio del rango (`YYYY-MM-DD`). Debe ser <= `hasta`.
          schema:
            type: string
            example: '2026-06-01'
        - name: hasta
          in: query
          required: true
          description: Fecha de fin del rango (`YYYY-MM-DD`).
          schema:
            type: string
            example: '2026-06-11'
      responses:
        '200':
          description: |
            Archivo CSV con cabecera
            `codigoSeguimiento,estado,remitente,destinatario,direccionDestino,createdAt`,
            una línea por envío en el rango.
          headers:
            Content-Disposition:
              description: 'attachment; filename="envios-<desde>-<hasta>.csv"'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: '`desde` es posterior a `hasta`, o error de validación.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: VALIDATION_ERROR
                message: "desde debe ser anterior o igual a hasta"
                statusCode: 422
                details: []

  /reportes/envios:
    get:
      tags: [Reportes]
      summary: Obtener reporte estadístico de envíos en un rango de fechas (totales por estado y por día).
      description: |
        Requiere rol OPERADOR. `porDia` agrupa por `createdAt` truncado a
        `YYYY-MM-DD`, ordenado ascendentemente. `totalPeriodo` es la suma de
        `porEstado[].total`.
      parameters:
        - name: desde
          in: query
          required: true
          description: Fecha de inicio del rango (`YYYY-MM-DD`). Debe ser <= `hasta`.
          schema:
            type: string
            example: '2026-06-01'
        - name: hasta
          in: query
          required: true
          description: Fecha de fin del rango (`YYYY-MM-DD`).
          schema:
            type: string
            example: '2026-06-11'
      responses:
        '200':
          description: Reporte estadístico de envíos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReporteEnviosDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: '`desde` es posterior a `hasta`, o error de validación.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: VALIDATION_ERROR
                message: "desde debe ser anterior o igual a hasta"
                statusCode: 422
                details: []

  /reportes/repartidores:
    get:
      tags: [Reportes]
      summary: Obtener ranking de repartidores por entregas completadas y fallidas.
      description: |
        Requiere rol OPERADOR. Para cada repartidor se recorren sus rutas y
        los envíos de cada ruta: `ENTREGADO` suma a `totalEntregados`;
        `FALLIDO` o `CANCELADO` suma a `totalFallidos`. Resultado ordenado
        descendentemente por `totalEntregados`.
      responses:
        '200':
          description: Ranking de repartidores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RepartidorRankingDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
