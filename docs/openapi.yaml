openapi: 3.0.3
info:
  title: API de Gestión Logística y Envíos
  version: "1.0.0"
  description: |
    API REST para un sistema de gestión logística y envíos. Permite a operadores
    crear y administrar envíos, agruparlos en rutas asignadas a repartidores y
    vehículos, y a los repartidores confirmar o reportar fallos de entrega
    (con evidencia fotográfica y firma). Los clientes pueden consultar sus
    propios envíos y hacer seguimiento público por código de tracking.

    Incluye además gestión de incidencias (con reactivación automática de
    entregas fallidas), notificaciones en tiempo real (vía Socket.IO, no
    documentado en este YAML), un dashboard operativo y reportes/estadísticas
    (incluyendo exportación CSV).

    ### Convenciones generales

    - **Base URL:** todas las rutas se montan bajo el prefijo `/api/v1`.
    - **Respuesta de éxito:** `{ "data": <payload>, "message": "string", "status": 200 }`.
    - **Respuesta de error:** `{ "error": "CODE", "message": "string", "statusCode": 422 }`.
      Los errores de validación Zod añaden además `details: ZodIssue[]`.
    - **Paginación:** parámetros de query `page` (default 1) y `limit` (varía por
      endpoint). Respuesta: `{ "data": [], "meta": { "total": 0, "page": 1, "limit": 20, "totalPages": 0 } }`.
    - **Fechas:** siempre en ISO 8601 UTC (ej. `2026-06-11T00:00:00.000Z`).
    - **Content-Type:** `application/json` por defecto. `multipart/form-data` para
      subida de evidencias de entrega/incidencias (máx. 5 MB por archivo, solo
      `image/jpeg` o `image/png`). `text/csv` para la exportación de reportes.
    - **Autenticación:** JWT Bearer (`Authorization: Bearer <accessToken>`,
      vigencia 15 minutos). El refresh token (7 días) se gestiona vía cookie
      httpOnly `refreshToken`.
    - **Roles:** `CLIENTE`, `OPERADOR`, `REPARTIDOR`. Cada usuario tiene
      exactamente un rol y un perfil asociado.
    - **Rate limiting:** `/api/v1/auth/*` está limitado a 10 solicitudes/minuto
      por IP.
servers:
  - url: http://localhost:3001/api/v1
    description: Desarrollo local
tags:
  - name: Auth
    description: Registro, login, sesión y recuperación de contraseña
  - name: Perfil
    description: Perfil del usuario autenticado
  - name: Usuarios
    description: Gestión de usuarios del sistema (OPERADOR)
  - name: Envios
    description: Gestión de envíos
  - name: Clientes
    description: Búsqueda de clientes y autoservicio de envíos del cliente
  - name: Tracking
    description: Seguimiento público de envíos por código
  - name: Rutas
    description: Gestión de rutas de reparto
  - name: Vehiculos
    description: Gestión de vehículos
  - name: Repartidores
    description: Gestión de repartidores (vista OPERADOR)
  - name: Entregas
    description: Autoservicio del repartidor para confirmar/reportar entregas
  - name: Incidencias
    description: Gestión de incidencias sobre envíos
  - name: Notificaciones
    description: Notificaciones del usuario autenticado
  - name: Dashboard
    description: Métricas y widgets operativos
  - name: Reportes
    description: Reportes y estadísticas
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Rol:
      type: string
      enum: [CLIENTE, OPERADOR, REPARTIDOR]
    EstadoEnvio:
      type: string
      enum:
        - PENDIENTE
        - EN_PREPARACION
        - EN_TRANSITO
        - EN_RUTA
        - ENTREGADO
        - CANCELADO
        - FALLIDO
    EstadoRuta:
      type: string
      enum:
        - PENDIENTE
        - EN_CURSO
        - EN_PROGRESO
        - COMPLETADA
        - CANCELADA
    EstadoVehiculo:
      type: string
      enum:
        - DISPONIBLE
        - EN_RUTA
        - MANTENIMIENTO
        - FUERA_SERVICIO
    TipoNotificacion:
      type: string
      enum:
        - ENVIO_CREADO
        - CAMBIO_ESTADO
        - ENTREGA_REALIZADA
        - RUTA_ASIGNADA
        - INCIDENCIA_REPORTADA
    TipoIncidencia:
      type: string
      enum:
        - ENTREGA_FALLIDA
        - CLIENTE_AUSENTE
        - DANIO
        - DIRECCION_INCORRECTA
        - OTRO
    EstadoIncidencia:
      type: string
      enum: [ABIERTA, EN_PROCESO, RESUELTA]
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 3
      required: [total, page, limit, totalPages]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Recurso no encontrado
        statusCode:
          type: integer
          example: 404
      required: [error, message, statusCode]
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            details:
              type: array
              items:
                type: object
                additionalProperties: true
                description: ZodIssue
          required: [details]

    # ── Auth, perfil y usuarios ──────────────────────────────────────────
    AuthUserPayload:
      type: object
      properties:
        id:
          type: string
          example: cklz3x9h00000a1b2c3d4e5f6
        nombre:
          type: string
          example: Juan Pérez
        correo:
          type: string
          format: email
          example: juan.perez@example.com
        rol:
          $ref: '#/components/schemas/Rol'
      required: [id, nombre, correo, rol]
    LoginResultDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT de acceso (vigencia 15 minutos)
        user:
          $ref: '#/components/schemas/AuthUserPayload'
      required: [accessToken, user]
    RefreshResultDto:
      type: object
      properties:
        accessToken:
          type: string
          description: Nuevo JWT de acceso (vigencia 15 minutos)
      required: [accessToken]
    RegisterResultDto:
      type: object
      properties:
        id:
          type: string
          example: cklz3x9h00000a1b2c3d4e5f6
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
      required: [id, correo, rol]
    PerfilDto:
      type: object
      properties:
        id:
          type: string
          example: cklz3x9h00000a1b2c3d4e5f6
        nombre:
          type: string
          example: Juan Pérez
        correo:
          type: string
          format: email
          example: juan.perez@example.com
        telefono:
          type: string
          nullable: true
          example: "+50588887777"
        rol:
          $ref: '#/components/schemas/Rol'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, nombre, correo, telefono, rol, createdAt, updatedAt]
    UsuarioDto:
      type: object
      properties:
        id:
          type: string
          example: cklz3x9h00000a1b2c3d4e5f6
        nombre:
          type: string
          example: Juan Pérez
        correo:
          type: string
          format: email
          example: juan.perez@example.com
        rol:
          $ref: '#/components/schemas/Rol'
        telefono:
          type: string
          nullable: true
          example: "+50588887777"
        activo:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
      required: [id, nombre, correo, rol, telefono, activo, createdAt]

    # ── Envíos, clientes, tracking ───────────────────────────────────────
    EnvioResponseDto:
      type: object
      properties:
        id:
          type: string
          example: cklz3x9h00010a1b2c3d4e5f7
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        remitente:
          type: string
          example: Almacén Central
        destinatario:
          type: string
          example: María López
        direccionDestino:
          type: string
          example: Av. Siempre Viva 742, Managua
        peso:
          type: number
          format: float
          example: 12.5
        dimensiones:
          type: string
          example: "30x20x15"
        descripcion:
          type: string
          nullable: true
          example: Caja de electrodomésticos
        clienteId:
          type: string
          example: cklz3x9h00020a1b2c3d4e5f8
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - codigoSeguimiento
        - estado
        - remitente
        - destinatario
        - direccionDestino
        - peso
        - dimensiones
        - descripcion
        - clienteId
        - createdAt
    EnvioListItemDto:
      type: object
      properties:
        id:
          type: string
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        remitente:
          type: string
        destinatario:
          type: string
        clienteId:
          type: string
        clienteNombre:
          type: string
          example: María López
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - codigoSeguimiento
        - estado
        - remitente
        - destinatario
        - clienteId
        - clienteNombre
        - createdAt
    EventoEnvioDto:
      type: object
      properties:
        id:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        descripcion:
          type: string
          example: Entrega reprogramada para 2026-06-15T00:00:00.000Z
        lat:
          type: number
          format: float
          nullable: true
          example: 12.136
        lng:
          type: number
          format: float
          nullable: true
          example: -86.251
        timestamp:
          type: string
          format: date-time
      required: [id, estado, descripcion, lat, lng, timestamp]
    EnvioDetalleDto:
      type: object
      properties:
        id:
          type: string
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        remitente:
          type: string
        destinatario:
          type: string
        direccionDestino:
          type: string
        peso:
          type: number
          format: float
        dimensiones:
          type: string
        descripcion:
          type: string
          nullable: true
        clienteId:
          type: string
        rutaId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/EventoEnvioDto'
      required:
        - id
        - codigoSeguimiento
        - estado
        - remitente
        - destinatario
        - direccionDestino
        - peso
        - dimensiones
        - descripcion
        - clienteId
        - rutaId
        - createdAt
        - updatedAt
        - eventos
    CancelarEnvioResponseDto:
      type: object
      properties:
        id:
          type: string
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
      required: [id, codigoSeguimiento, estado]
    ReprogramarEnvioResponseDto:
      type: object
      properties:
        id:
          type: string
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        fechaReprogramacion:
          type: string
          format: date-time
      required: [id, codigoSeguimiento, estado, fechaReprogramacion]
    MisEnviosItemDto:
      type: object
      properties:
        id:
          type: string
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        destinatario:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, codigoSeguimiento, estado, destinatario, createdAt]
    ClienteSearchItemDto:
      type: object
      properties:
        id:
          type: string
        usuario:
          type: object
          properties:
            nombre:
              type: string
              example: María López
            correo:
              type: string
              format: email
              example: maria.lopez@example.com
          required: [nombre, correo]
      required: [id, usuario]
    TrackingEventoDto:
      type: object
      properties:
        id:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        descripcion:
          type: string
        lat:
          type: number
          format: float
          nullable: true
        lng:
          type: number
          format: float
          nullable: true
        timestamp:
          type: string
          format: date-time
      required: [id, estado, descripcion, lat, lng, timestamp]
    TrackingResponseDto:
      type: object
      properties:
        envioId:
          type: string
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        remitente:
          type: string
        destinatario:
          type: string
        direccionDestino:
          type: string
        ultimaActualizacion:
          type: string
          format: date-time
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/TrackingEventoDto'
      required:
        - envioId
        - codigoSeguimiento
        - estado
        - remitente
        - destinatario
        - direccionDestino
        - ultimaActualizacion
        - eventos

    # ── Rutas, vehículos, repartidores ───────────────────────────────────
    VehiculoResponseDto:
      type: object
      properties:
        id:
          type: string
        placa:
          type: string
          example: M123456
        modelo:
          type: string
          example: Hyundai H100
        capacidad:
          type: number
          format: float
          example: 1500
        estado:
          $ref: '#/components/schemas/EstadoVehiculo'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, placa, modelo, capacidad, estado, createdAt, updatedAt]
    VehiculoDisponibleDto:
      type: object
      properties:
        id:
          type: string
        placa:
          type: string
          example: M123456
        modelo:
          type: string
          example: Hyundai H100
        estado:
          $ref: '#/components/schemas/EstadoVehiculo'
      required: [id, placa, modelo, estado]
    RepartidorUsuarioDto:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
          example: Carlos Ramírez
        correo:
          type: string
          format: email
          example: carlos.ramirez@example.com
        telefono:
          type: string
          nullable: true
          example: "+50588889999"
      required: [id, nombre, correo, telefono]
    RepartidorDto:
      type: object
      properties:
        id:
          type: string
        licencia:
          type: string
          nullable: true
          example: B-123456
        disponible:
          type: boolean
          example: true
        usuario:
          $ref: '#/components/schemas/RepartidorUsuarioDto'
      required: [id, licencia, disponible, usuario]
    RepartidorDetalleDto:
      allOf:
        - $ref: '#/components/schemas/RepartidorDto'
    EnvioOrdenadoDto:
      type: object
      properties:
        orden:
          type: integer
          example: 1
        envioId:
          type: string
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        direccionDestino:
          type: string
        lat:
          type: number
          format: float
          nullable: true
        lng:
          type: number
          format: float
          nullable: true
      required: [orden, envioId, codigoSeguimiento, direccionDestino, lat, lng]
    RutaOptimaResponseDto:
      type: object
      properties:
        paradas:
          type: array
          items:
            $ref: '#/components/schemas/EnvioOrdenadoDto'
        advertencia:
          type: string
          nullable: true
          example: null
      required: [paradas, advertencia]
    RutaResponseDto:
      type: object
      properties:
        id:
          type: string
        codigo:
          type: string
          example: RUT-20260611-XY98ZW76
        estado:
          $ref: '#/components/schemas/EstadoRuta'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        vehiculo:
          $ref: '#/components/schemas/VehiculoResponseDto'
        repartidor:
          $ref: '#/components/schemas/RepartidorDto'
        envios:
          type: array
          items:
            $ref: '#/components/schemas/EnvioListItemDto'
      required: [id, codigo, estado, createdAt, updatedAt, vehiculo, repartidor, envios]
    RutaPendienteDto:
      type: object
      properties:
        id:
          type: string
        codigo:
          type: string
          example: RUT-20260611-XY98ZW76
        nombre:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
      required: [id, codigo, nombre, createdAt]

    # ── Entregas, incidencias, notificaciones ────────────────────────────
    EntregaListItemDto:
      type: object
      properties:
        id:
          type: string
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        destinatario:
          type: string
        direccionDestino:
          type: string
        rutaId:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required: [id, codigoSeguimiento, estado, destinatario, direccionDestino, rutaId, updatedAt]
    EntregasAgrupadasDto:
      type: object
      properties:
        pendientes:
          type: array
          items:
            $ref: '#/components/schemas/EntregaListItemDto'
        completadas:
          type: array
          items:
            $ref: '#/components/schemas/EntregaListItemDto'
      required: [pendientes, completadas]
    ConfirmarEntregaResponseDto:
      type: object
      properties:
        id:
          type: string
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        estado:
          type: string
          enum: [ENTREGADO]
        evidenciaFoto:
          type: string
          example: /uploads/entregas/cklz3x9h00010a1b2c3d4e5f7/foto.jpg
        firma:
          type: string
          example: /uploads/entregas/cklz3x9h00010a1b2c3d4e5f7/firma.png
        fechaEntrega:
          type: string
          format: date-time
      required: [id, codigoSeguimiento, estado, evidenciaFoto, firma, fechaEntrega]
    RegistrarFalloResponseDto:
      type: object
      properties:
        id:
          type: string
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        estado:
          type: string
          enum: [FALLIDO]
        incidenciaId:
          type: string
      required: [id, codigoSeguimiento, estado, incidenciaId]
    IncidenciaDto:
      type: object
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoIncidencia'
        descripcion:
          type: string
          example: El cliente no se encontraba en la dirección
        estado:
          $ref: '#/components/schemas/EstadoIncidencia'
        foto:
          type: string
          nullable: true
          example: /uploads/entregas/cklz3x9h00010a1b2c3d4e5f7/foto.jpg
        nota:
          type: string
          nullable: true
          example: Cliente ausente, se reintentará mañana
        envioId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, tipo, descripcion, estado, foto, nota, envioId, createdAt, updatedAt]
    IncidenciaListItemDto:
      type: object
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoIncidencia'
        descripcion:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoIncidencia'
        envioId:
          type: string
        envioCodigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        createdAt:
          type: string
          format: date-time
      required: [id, tipo, descripcion, estado, envioId, envioCodigoSeguimiento, createdAt]
    NotificacionDto:
      type: object
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoNotificacion'
        mensaje:
          type: string
          example: Tu envío TRK-20260611-AB12CD34 ha sido creado
        leida:
          type: boolean
          example: false
        envioId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, tipo, mensaje, leida, envioId, createdAt]

    # ── Dashboard y reportes ─────────────────────────────────────────────
    DashboardMetricsDto:
      type: object
      properties:
        totalEnvios:
          type: integer
          example: 124
        enRuta:
          type: integer
          example: 18
        entregados:
          type: integer
          example: 95
        incidenciasAbiertas:
          type: integer
          example: 3
      required: [totalEnvios, enRuta, entregados, incidenciasAbiertas]
    EnvioRecienteDto:
      type: object
      properties:
        codigoSeguimiento:
          type: string
          example: TRK-20260611-AB12CD34
        clienteNombre:
          type: string
          example: María López
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        createdAt:
          type: string
          format: date-time
      required: [codigoSeguimiento, clienteNombre, estado, createdAt]
    ReporteEnviosPorEstadoDto:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/EstadoEnvio'
        total:
          type: integer
          example: 32
      required: [estado, total]
    ReporteEnviosPorDiaDto:
      type: object
      properties:
        fecha:
          type: string
          example: "2026-06-11"
        total:
          type: integer
          example: 12
      required: [fecha, total]
    ReporteEnviosDto:
      type: object
      properties:
        porEstado:
          type: array
          items:
            $ref: '#/components/schemas/ReporteEnviosPorEstadoDto'
        porDia:
          type: array
          items:
            $ref: '#/components/schemas/ReporteEnviosPorDiaDto'
        totalPeriodo:
          type: integer
          example: 124
      required: [porEstado, porDia, totalPeriodo]
    RepartidorRankingDto:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
          example: Carlos Ramírez
        totalEntregados:
          type: integer
          example: 48
        totalFallidos:
          type: integer
          example: 3
      required: [id, nombre, totalEntregados, totalFallidos]

    # ── Request bodies ───────────────────────────────────────────────────
    RegisterRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          example: Juan Pérez
        correo:
          type: string
          format: email
          example: juan.perez@example.com
        password:
          type: string
          minLength: 8
          format: password
          example: SuperSecreta123
        confirmPassword:
          type: string
          minLength: 1
          format: password
          example: SuperSecreta123
        telefono:
          type: string
          minLength: 1
          example: "+50588887777"
        rol:
          $ref: '#/components/schemas/Rol'
      required: [nombre, correo, password, confirmPassword, telefono, rol]
    LoginRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
          example: juan.perez@example.com
        password:
          type: string
          minLength: 1
          format: password
          example: SuperSecreta123
      required: [correo, password]
    ForgotPasswordRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
          example: juan.perez@example.com
      required: [correo]
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          example: a1b2c3d4e5f6...
        newPassword:
          type: string
          minLength: 8
          format: password
          example: NuevaSecreta456
      required: [token, newPassword]
    UpdateMeRequest:
      type: object
      description: Debe proporcionarse al menos uno de los dos campos.
      properties:
        nombre:
          type: string
          minLength: 1
          example: Juan Pérez Actualizado
        telefono:
          type: string
          minLength: 1
          example: "+50588880000"
    ActualizarEstadoUsuarioRequest:
      type: object
      additionalProperties: false
      properties:
        activo:
          type: boolean
          example: false
      required: [activo]
    CrearEnvioRequest:
      type: object
      properties:
        remitente:
          type: string
          minLength: 1
          example: Almacén Central
        destinatario:
          type: string
          minLength: 1
          example: María López
        direccionDestino:
          type: string
          minLength: 1
          example: Av. Siempre Viva 742, Managua
        peso:
          type: number
          format: float
          exclusiveMinimum: true
          minimum: 0
          example: 12.5
        dimensiones:
          type: string
          pattern: '^\d+(\.\d+)?x\d+(\.\d+)?x\d+(\.\d+)?$'
          example: "30x20x15"
        clienteId:
          type: string
          description: cuid del cliente
          example: cklz3x9h00020a1b2c3d4e5f8
        descripcion:
          type: string
          example: Caja de electrodomésticos
      required: [remitente, destinatario, direccionDestino, peso, dimensiones, clienteId]
    EditarEnvioRequest:
      type: object
      description: Al menos un campo editable debe proporcionarse.
      properties:
        remitente:
          type: string
          minLength: 1
          example: Almacén Central
        destinatario:
          type: string
          minLength: 1
          example: María López
        direccionDestino:
          type: string
          minLength: 1
          example: Av. Siempre Viva 742, Managua
        peso:
          type: number
          format: float
          exclusiveMinimum: true
          minimum: 0
          example: 12.5
        dimensiones:
          type: string
          pattern: '^\d+(\.\d+)?x\d+(\.\d+)?x\d+(\.\d+)?$'
          example: "30x20x15"
        descripcion:
          type: string
          nullable: true
          example: Caja de electrodomésticos
    ReprogramarEnvioRequest:
      type: object
      properties:
        fechaReprogramacion:
          type: string
          format: date-time
          description: Fecha estrictamente futura.
          example: "2026-06-20T00:00:00.000Z"
      required: [fechaReprogramacion]
    CrearRutaRequest:
      type: object
      properties:
        enviosIds:
          type: array
          minItems: 1
          items:
            type: string
            description: cuid del envío
          example: [cklz3x9h00010a1b2c3d4e5f7]
        vehiculoId:
          type: string
          description: cuid del vehículo
          example: cklz3x9h00030a1b2c3d4e5f9
        repartidorId:
          type: string
          description: cuid del repartidor
          example: cklz3x9h00040a1b2c3d4e5fa
      required: [enviosIds, vehiculoId, repartidorId]
    ReasignarRutaRequest:
      type: object
      properties:
        repartidorId:
          type: string
          description: cuid del repartidor
          example: cklz3x9h00040a1b2c3d4e5fa
        vehiculoId:
          type: string
          description: cuid del vehículo
          example: cklz3x9h00030a1b2c3d4e5f9
    CrearVehiculoRequest:
      type: object
      properties:
        placa:
          type: string
          example: M123456
        modelo:
          type: string
          example: Hyundai H100
        capacidad:
          type: number
          format: float
          example: 1500
      required: [placa, modelo, capacidad]
    ActualizarEstadoVehiculoRequest:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/EstadoVehiculo'
      required: [estado]
    ActualizarRepartidorRequest:
      type: object
      properties:
        disponible:
          type: boolean
          example: true
        licencia:
          type: string
          nullable: true
          example: B-123456
    CrearIncidenciaRequest:
      type: object
      properties:
        envioId:
          type: string
          description: cuid del envío afectado
          example: cklz3x9h00010a1b2c3d4e5f7
        tipo:
          $ref: '#/components/schemas/TipoIncidencia'
        descripcion:
          type: string
          minLength: 1
          example: El cliente no se encontraba en la dirección
      required: [envioId, tipo, descripcion]
    ActualizarEstadoIncidenciaRequest:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/EstadoIncidencia'
      required: [estado]
  responses:
    Unauthorized:
      description: No autenticado (token ausente, inválido o expirado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingToken:
              summary: Token de acceso requerido
              value: { error: MISSING_TOKEN, message: Token de acceso requerido, statusCode: 401 }
            invalidToken:
              summary: Token inválido
              value: { error: INVALID_TOKEN, message: Token inválido, statusCode: 401 }
            expiredToken:
              summary: Token expirado
              value: { error: EXPIRED_TOKEN, message: Token expirado, statusCode: 401 }
    Forbidden:
      description: Acceso denegado por rol insuficiente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: FORBIDDEN
            message: "Acceso denegado: se requiere rol OPERADOR"
            statusCode: 403
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NOT_FOUND
            message: Recurso no encontrado
            statusCode: 404
    ValidationError:
      description: Error de validación de body/query/params (Zod).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            error: VALIDATION_ERROR
            message: "peso: Number must be greater than 0"
            statusCode: 422
            details:
              - code: too_small
                minimum: 0
                type: number
                inclusive: false
                path: [peso]
                message: Number must be greater than 0
    Conflict:
      description: Conflicto de estado o de unicidad.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: CONFLICT
            message: Conflicto de estado
            statusCode: 409
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un nuevo usuario (cliente, operador o repartidor) y crear su perfil asociado según el rol.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegisterResultDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 201
        '409':
          description: El correo ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_ALREADY_EXISTS
                message: El correo ya está registrado
                statusCode: 409
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar usuario por correo y contraseña; devuelve access token y setea cookie de refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso.
          headers:
            Set-Cookie:
              description: Cookie httpOnly `refreshToken` (7 días, `secure` en producción, `sameSite=strict`).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResultDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_CREDENTIALS
                message: Credenciales inválidas
                statusCode: 401
        '403':
          description: La cuenta está desactivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: USER_INACTIVE
                message: "La cuenta está desactivada. Contacta al administrador."
                statusCode: 403
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar el access token a partir del refresh token almacenado en cookie.
      security: []
      description: |
        No recibe body; lee la cookie httpOnly `refreshToken`. Revoca el refresh
        token usado y emite uno nuevo (rotación), devuelto en la misma cookie.
      responses:
        '200':
          description: Token renovado correctamente.
          headers:
            Set-Cookie:
              description: Nueva cookie httpOnly `refreshToken` (rotación).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RefreshResultDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          description: Refresh token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingRefreshToken:
                  summary: Refresh token ausente
                  value: { error: MISSING_REFRESH_TOKEN, message: Refresh token ausente, statusCode: 401 }
                invalidRefreshToken:
                  summary: Token inválido
                  value: { error: INVALID_REFRESH_TOKEN, message: Token inválido, statusCode: 401 }
                expiredRefreshToken:
                  summary: Sesión expirada
                  value: { error: EXPIRED_REFRESH_TOKEN, message: "Sesión expirada, inicia sesión de nuevo", statusCode: 401 }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión revocando el refresh token y limpiando la cookie.
      security: []
      description: |
        No recibe body; lee la cookie httpOnly `refreshToken` (opcional). Si
        existe un refresh token válido y no revocado, lo marca como revocado.
        Limpia la cookie `refreshToken`. No falla si la cookie está ausente o el
        token ya estaba revocado.
      responses:
        '200':
          description: Sesión cerrada correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    example: null
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Solicitar el envío de un correo de recuperación de contraseña.
      security: []
      description: |
        Si el correo no existe, no hace nada (mismo mensaje, sin error). Si
        existe, genera un token aleatorio (32 bytes hex), lo persiste con
        expiración de 1 hora y envía un email con el enlace de recuperación.
        En `NODE_ENV=test` el envío de correo se omite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Solicitud procesada (no revela si el correo existe).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    example: null
                  message:
                    type: string
                    example: Si el correo existe recibirás un enlace de recuperación
                  status:
                    type: integer
                    example: 200
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Restablecer la contraseña usando el token recibido por correo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    example: null
                  message:
                    type: string
                    example: Contraseña actualizada correctamente
                  status:
                    type: integer
                    example: 200
        '400':
          description: Token de recuperación inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_RESET_TOKEN
                message: Token inválido o expirado
                statusCode: 400
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/me:
    get:
      tags: [Perfil]
      summary: Obtener el perfil del usuario autenticado.
      description: Requiere cualquier rol autenticado (CLIENTE, OPERADOR o REPARTIDOR).
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PerfilDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: NOT_FOUND
                message: Usuario no encontrado
                statusCode: 404
    patch:
      tags: [Perfil]
      summary: Actualizar nombre y/o teléfono del usuario autenticado.
      description: |
        Requiere cualquier rol autenticado (CLIENTE, OPERADOR o REPARTIDOR).
        Debe proporcionarse al menos uno de `nombre` o `telefono`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PerfilDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios del sistema con paginación y filtro opcional por rol.
      description: Requiere rol OPERADOR.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: rol
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Rol'
      responses:
        '200':
          description: Lista paginada de usuarios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsuarioDto'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener el detalle de un usuario por su ID.
      description: Requiere rol OPERADOR.
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del usuario
          schema:
            type: string
      responses:
        '200':
          description: Detalle del usuario.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UsuarioDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: NOT_FOUND
                message: Usuario no encontrado
                statusCode: 404

  /usuarios/{id}/estado:
    patch:
      tags: [Usuarios]
      summary: Activar o desactivar la cuenta de un usuario.
      description: |
        Requiere rol OPERADOR. Un operador no puede desactivar su propia cuenta.
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del usuario
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEstadoUsuarioRequest'
      responses:
        '200':
          description: Estado del usuario actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UsuarioDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: NOT_FOUND
                message: Usuario no encontrado
                statusCode: 404
        '409':
          description: No puedes desactivar tu propia cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: CANNOT_DEACTIVATE_SELF
                message: No puedes desactivar tu propia cuenta
                statusCode: 409
        '422':
          $ref: '#/components/responses/ValidationError'

  /envios:
    post:
      tags: [Envios]
      summary: Registrar un nuevo envío para un cliente existente.
      description: |
        Requiere rol OPERADOR. Genera `codigoSeguimiento` único
        (`TRK-YYYYMMDD-XXXXXXXX`). Envía notificación al usuario del cliente
        con tipo `ENVIO_CREADO`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearEnvioRequest'
      responses:
        '201':
          description: Envío creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvioResponseDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 201
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Cliente no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: CLIENTE_NOT_FOUND
                message: Cliente no encontrado
                statusCode: 404
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          description: No se pudo generar un código de seguimiento único.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: CODIGO_GENERATION_FAILED
                message: No se pudo generar un código de seguimiento único
                statusCode: 500
    get:
      tags: [Envios]
      summary: Listar envíos con paginación y filtros.
      description: Requiere rol OPERADOR.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: estado
          in: query
          required: false
          description: Filtrar por estado del envío.
          schema:
            $ref: '#/components/schemas/EstadoEnvio'
        - name: cliente
          in: query
          required: false
          description: Filtrar por nombre de cliente (contiene, insensible a mayúsculas).
          schema:
            type: string
        - name: codigo
          in: query
          required: false
          description: Filtrar por código de seguimiento (contiene, insensible a mayúsculas).
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de envíos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnvioListItemDto'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /envios/{id}:
    get:
      tags: [Envios]
      summary: Obtener el detalle de un envío, incluyendo su historial de eventos.
      description: Requiere rol OPERADOR.
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del envío
          schema:
            type: string
      responses:
        '200':
          description: Detalle del envío.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvioDetalleDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Envío no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ENVIO_NOT_FOUND
                message: Envío no encontrado
                statusCode: 404
    patch:
      tags: [Envios]
      summary: Editar datos de un envío existente.
      description: |
        Requiere rol OPERADOR. Debe enviarse al menos un campo editable
        (validado con `.refine`).
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del envío
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarEnvioRequest'
      responses:
        '200':
          description: Envío actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvioResponseDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '400':
          description: Se requiere al menos un campo editable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VALIDATION_ERROR
                message: Se requiere al menos un campo editable
                statusCode: 400
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Envío no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ENVIO_NOT_FOUND
                message: Envío no encontrado
                statusCode: 404
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Envios]
      summary: Cancelar un envío en estado PENDIENTE.
      description: |
        Requiere rol OPERADOR. Solo permite cancelar envíos en estado
        `PENDIENTE`. Si el envío pertenecía a una ruta, se evalúa el cierre
        automático de la ruta.
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del envío
          schema:
            type: string
      responses:
        '200':
          description: Envío cancelado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CancelarEnvioResponseDto'
                  message:
                    type: string
                  status:
                    type: integer
                    example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Envío no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ENVIO_NOT_FOUND
                message: Envío no encontrado
                statusCode: 404
        '409':
          description: Solo se pueden cancelar envíos en estado PENDIENTE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_STATE_TRANSITION
                message: Solo se pueden cancelar envíos en estado PENDIENTE
                statusCode: 409

